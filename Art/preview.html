<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Flavor Text Extended - Français (unofficial)</title>
<style>
:root {--veil:#302317;--inkPrimary:#F2ECE1;--inkSecondary:#E9C389;--accent:#49BDF0;--badgeInk:#17120E;}
* { box-sizing: border-box; }
html, body { margin: 0; width: 896px; height: 504px; overflow: hidden; }
body { font-family: "Segoe UI", system-ui, sans-serif; background: var(--veil); }
.art { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; object-position:center bottom; }
.veil { position:absolute; inset:0; background:linear-gradient(90deg, var(--veil) 0%, var(--veil) 38%, transparent 83%); opacity:.95; }
.copy { position:absolute; left:50px; top:54px; color:var(--inkPrimary); text-shadow:0 3px 10px rgba(0,0,0,.75); }
h1,p { margin:0; }
h1 { font-size:46px; font-weight:600; line-height:1.1; letter-spacing:0; }
.suffix { font-size:.65em; color:var(--inkSecondary); }
.tag { margin-top:8px; font-size:24px; line-height:1.1; font-weight:400; letter-spacing:.2px; color:var(--inkSecondary); }
.rule { width:58px; height:3px; margin-top:20px; margin-bottom:16px; background:var(--accent); }
.summary { width:430px; font-size:21px; line-height:1.45; font-weight:400; }
.badge { position:absolute; right:0; top:0; width:80px; height:80px; background:var(--accent); clip-path:polygon(0 0,100% 0,100% 100%); }
.version { position:absolute; left:869px; top:27px; transform:translate(-50%,-50%) rotate(45deg); font-size:26px; font-weight:700; line-height:1; color:var(--badgeInk); }
</style>
<img class="art" src="Preview-source.png" alt="Painted dishes on a wooden table">
<div class="veil"></div>
<div class="copy">
  <h1>Flavor Text Extended<br><span class="suffix">- Français</span></h1>
  <p class="tag">(unofficial)</p>
  <div class="rule"></div>
  <p class="summary">French names and descriptions<br>for your colony’s meals.</p>
</div>
<div class="badge"></div><span class="version">1.6</span>
</html>
